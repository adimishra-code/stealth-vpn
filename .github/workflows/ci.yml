name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend - audit + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test -- --runInBand

  frontend:
    name: Frontend - audit + lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Production deps only: the remaining advisories (vite/esbuild) affect
      # the dev server, which never ships — the built artifact is static files
      # served by nginx. Fixing them requires vite 8 (breaking; plugin-react@4
      # peers cap at vite ^7). Revisit when the plugin supports vite 8.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  shellcheck:
    name: Shell scripts - syntax + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck all scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version >/dev/null
            shellcheck deploy/*.sh deploy/scripts/*.sh scripts/*.sh
          else
            echo "shellcheck not available — skipping"
          fi
        shell: bash
