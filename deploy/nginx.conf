# ──────────────────────────────────────────────────────────────────────────────
# StealthVPN — nginx site config (control-plane host, TLS via certbot).
#
# Deployment notes:
#   * Frontend build: /opt/stealth-vpn/frontend/dist; API: 127.0.0.1:5000 (PM2).
#   * Do NOT run Xray-Reality on 443 here — Reality needs raw 443; VPN nodes
#     own 443 on their own host/IP (an all-in-one host must move one off 443).
#   * WireGuard UDP 51820 is separate and unaffected.
#
# Install:  cp deploy/nginx.conf /etc/nginx/sites-available/stealth-vpn
#           ln -s /etc/nginx/sites-available/stealth-vpn /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
# TLS:      run deploy/certbot-setup.sh (webroot mode — this config already
#           exposes /.well-known/acme-challenge/ on port 80).
# ──────────────────────────────────────────────────────────────────────────────

# Access-log format WITHOUT query strings: email-verify/password-reset URLs
# carry ?token=... which the default "combined" format would persist to
# access.log. Logs $uri only. Valid here because this file is included from
# the http context.
log_format stealth '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# ── Rate limiting (CSP-06) ─────────────────────────────────────────────────────
# nginx-side budget in front of the API (backend rate-limits per-IP too).
# Zones key on $binary_remote_addr — this server sits behind Cloudflare or
# directly in front of the API, so $remote_addr is the real client in both cases.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

# HTTP — force HTTPS, but leave ACME challenges reachable for renewal.
server {
    listen 80;
    listen [::]:80;
    server_name stealthvpn.example.com;

    access_log /var/log/nginx/access.log stealth;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stealthvpn.example.com;

    access_log /var/log/nginx/access.log stealth;

    ssl_certificate     /etc/letsencrypt/live/stealthvpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stealthvpn.example.com/privkey.pem;

    # Keep explicit — certbot --nginx would rewrite these; TLS stays conservative pre-issuance.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    # HSTS 2y + preload — only keep preload after submitting to hstspreload.org.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    # DENY: app is never embedded in frames (CSP frame-ancestors 'none' below; Razorpay's iframe is its own origin).
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: checkout.razorpay.com hosts the payment iframe + loader; Razorpay's
    # overlay needs 'unsafe-inline' styles. If checkout breaks, read the CSP console first.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.razorpay.com; font-src 'self' data:; frame-src https://checkout.razorpay.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Raw body needed for Razorpay signature verification; handler re-fetches
    # an order + writes Mongo before replying. 30s so a slow SSH cleanup never
    # hits the gateway's 60s default.
    location /api/payment/webhook {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        # API responses carry secrets (device configs, QR payloads) — never cached.
        add_header Cache-Control "no-store" always;
    }

    # Login/register/refresh/totp + CSRF mint: tight budget, burst only for multi-tab opens.
    location ~ ^/api/(auth/|csrf-token) {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }

    # Token-bearing SPA routes: ?token= must never reach any log (belt and braces).
    location = /verify-email { access_log off; try_files $uri /index.html; }
    location = /reset-password { access_log off; try_files $uri /index.html; }

    # SPA: hashed assets are immutable; index.html must always be fresh.
    root /opt/stealth-vpn/frontend/dist;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Small API + config payloads — the cap is 1 MB.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;
}
