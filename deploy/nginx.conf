# ──────────────────────────────────────────────────────────────────────────────
# StealthVPN — nginx site config (control-plane host, TLS via certbot).
#
# Deployment notes:
#   * Frontend build:  /opt/stealth-vpn/frontend/dist
#   * Backend API:     127.0.0.1:5000 (PM2)
#   * The control-plane host must NOT run an Xray-Reality inbound on 443 on
#     the same public IP — Reality needs raw 443. Run the API + nginx on the
#     control-plane host and keep every VPN node on its own host/IP (each node
#     owns 443 for Xray). Single-host all-in-one setups must run nginx on a
#     different port (or move Xray off 443), which breaks Reality stealth.
#   * WireGuard UDP 51820 is separate and unaffected by this file.
#
# Install:  cp deploy/nginx.conf /etc/nginx/sites-available/stealth-vpn
#           ln -s /etc/nginx/sites-available/stealth-vpn /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx
# TLS:      run deploy/certbot-setup.sh (webroot mode — this config already
#           exposes /.well-known/acme-challenge/ on port 80).
# ──────────────────────────────────────────────────────────────────────────────

# Access-log format WITHOUT query strings. Email-verification and password-
# reset links carry ?token=... in the URL; the default "combined" format
# (which logs $request, query string included) would persist those tokens to
# /var/log/nginx/access.log. This format logs the path ($uri) only.
# Valid here because this file is included from the http context.
log_format stealth '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# HTTP — force HTTPS, but leave ACME challenges reachable for renewal.
server {
    listen 80;
    listen [::]:80;
    server_name stealthvpn.example.com;

    access_log /var/log/nginx/access.log stealth;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stealthvpn.example.com;

    access_log /var/log/nginx/access.log stealth;

    ssl_certificate     /etc/letsencrypt/live/stealthvpn.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stealthvpn.example.com/privkey.pem;

    # certbot --nginx would rewrite these; keep them explicit so TLS is
    # conservative even before the first cert issuance.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;
    # HSTS for 2 years; preload only after the domain is submitted to
    # https://hstspreload.org — preload before that would be a lie to the
    # browser, so remove the flag if the submission is not planned.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # CSP: checkout.razorpay.com hosts the payment iframe + its loader script;
    # 'unsafe-inline' styles are required by Razorpay's checkout overlay.
    # If the checkout breaks after deployment, open the console for CSP
    # violations before loosening this policy.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.razorpay.com; font-src 'self' data:; frame-src https://checkout.razorpay.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Raw request body is needed for Razorpay signature verification, and the
    # webhook handler re-fetches an order + writes Mongo before replying 200.
    # Give it 30s; the handler is also fast enough that 5s would do, but a
    # slow SSH cleanup must never hit the gateway's default (60s) timeout.
    location /api/payment/webhook {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Token-bearing SPA routes: ?token=... must never reach any log, even with
    # the query-string-free format above (belt and braces).
    location = /verify-email { access_log off; try_files $uri /index.html; }
    location = /reset-password { access_log off; try_files $uri /index.html; }

    # SPA: hashed assets are immutable; index.html must always be fresh.
    root /opt/stealth-vpn/frontend/dist;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Small API + config payloads — the cap is 1 MB.
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_vary on;
}
