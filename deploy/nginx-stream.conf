# ──────────────────────────────────────────────────────────────────────────────
# StealthVPN — Nginx stream SNI multiplexer (SEC-05)
#
# Resolves port 443 collision between Nginx web UI and Xray-core Reality:
#   * External port 443 receives all TLS connections.
#   * ssl_preread inspects SNI without terminating TLS.
#   * Web domain SNI -> Nginx internal HTTPS listener on 127.0.0.1:8443.
#   * Decoy / non-matching SNI -> Xray Reality inbound on 127.0.0.1:4430.
#
# Usage:
#   Include this file at the top level of /etc/nginx/nginx.conf:
#     include /srv/stealthvpn/deploy/nginx-stream.conf;
# ──────────────────────────────────────────────────────────────────────────────

stream {
    map $ssl_preread_server_name $backend_pool {
        stealthvpn.example.com  nginx_web_https;
        default                 xray_reality_tcp;
    }

    upstream nginx_web_https {
        server 127.0.0.1:8443;
    }

    upstream xray_reality_tcp {
        server 127.0.0.1:4430;
    }

    server {
        listen 443;
        listen [::]:443;
        proxy_pass $backend_pool;
        ssl_preread on;
    }
}
